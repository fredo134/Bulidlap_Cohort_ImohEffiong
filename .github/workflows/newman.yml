name: API Test Automation (Newman)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          cd API_testing
          npm install

      - name: Run Postman Collection via Newman
        run: |
          cd API_testing
          npx newman run "Automation Exercise - API Tests.postman_collection.json" -e "Buildlab.postman_environment.json" --reporters cli,html --reporter-html-export newman-report.html

      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: API_testing/newman-report.html
